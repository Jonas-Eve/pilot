# One-off: creates or updates the PILOT labels with this repository's own token, for a repository whose owner has no
# terminal with an authenticated `gh` (scripts/setup-github-labels.sh does the work; it never deletes a label).
# Run it from the Actions tab ("Run workflow"), then delete this file.
name: PILOT labels (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the PILOT labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" project
          cd project
          bash scripts/setup-github-labels.sh "$REPO"
