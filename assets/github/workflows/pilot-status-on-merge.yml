name: PILOT Status On Merge

# A ticket whose PR merged moves to `merged`, and its parent story or epic follows (`pilot.py ticket merged`). The build workflow does the same
# when it merges the PR itself; this covers a PR a human merges. Idempotent.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to process (manual test, no real merge needed)"
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pilot-status-on-merge
  cancel-in-progress: false

jobs:
  merged:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Move the tickets this PR closes to merged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          body="$(gh api "repos/${REPO}/pulls/${PR}" --jq '.body // ""')"
          for n in $(printf '%s' "$body" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' | grep -oE '[0-9]+' | sort -u); do
            python3 .pilot/pilot.py --repo "$REPO" ticket merged "$n" || echo "ticket #$n left as it is"
          done
